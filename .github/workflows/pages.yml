name: Refresh and deploy Storm Chaser
on:
  push:
    branches: [main]
  workflow_dispatch:
  schedule:
    - cron: '12,42 * * * *'
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: storm-chaser-pages
  cancel-in-progress: false
jobs:
  publish:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - run: python -m unittest -v
      - run: node --check site/app.js
      - name: Verify dashboard on Chromium
        if: github.event_name != 'schedule'
        run: |
          npm install --prefix "$RUNNER_TEMP/sc-test" playwright@1.56.1
          python -m http.server --directory site 8742 &
          server=$!
          trap 'kill "$server"' EXIT
          CHROME_PATH="$(command -v google-chrome)" NODE_PATH="$RUNNER_TEMP/sc-test/node_modules" node checks/browser.cjs
      - uses: actions/cache/restore@v4
        with:
          path: .last/events.json
          key: sc-feed-v2-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: sc-feed-v2-
      - run: |
          if test -s .last/events.json; then cp .last/events.json site/events.json; fi
          python collect.py
          mkdir -p .last
          cp site/events.json .last/events.json
      - uses: actions/cache/save@v4
        with:
          path: .last/events.json
          key: sc-feed-v2-${{ github.run_id }}-${{ github.run_attempt }}
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - uses: actions/deploy-pages@v4
        id: deployment
